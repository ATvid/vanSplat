<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van Splat</title>
<style>
/* layout: one full-bleed pixel canvas; the hint text is drawn into the same pixel grid */
:root {
  --sky: #bb172a;
  --ink: #07070c;
  --paper: #fff3e6;
  --flame: #ffd23e;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--sky); color: var(--paper); overflow: hidden; font-family: var(--mono); }
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; outline: none; }
#stage.dragging { cursor: grabbing; }
#stage.hot { cursor: pointer; }
#stage canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
#hud { pointer-events: none; }
#raw {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font: 700 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--paper); background: var(--ink);
  border: 2px solid var(--paper); border-radius: 0; padding: 8px 10px; cursor: pointer;
}
#raw:hover { color: var(--ink); background: var(--flame); border-color: var(--ink); }
#raw:focus-visible, #stage:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
#raw[aria-pressed="true"] { color: var(--ink); background: var(--paper); border-color: var(--ink); }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage" tabindex="0" role="application" aria-label="Flying van scene. Drag to look around, click the van to open or close its side doors.">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
</div>
<button id="raw" type="button" aria-pressed="false" title="Show the gaussian splats without the pixel-art pass">Raw splats</button>
<div id="fail" hidden>This scene needs WebGL2, which this browser did not provide.</div>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ utils */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = x => { const s = Math.sin(x * 127.1 + 11.7) * 43758.5453; return s - Math.floor(s); };
function mulberry(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hex = h => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];

// column-major 4x4 matrices
const M4 = {
  ident() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b, o) {
    o = o || new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
      o[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
      o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
      o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
      o[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
    }
    return o;
  },
  T(x, y, z) { const m = M4.ident(); m[12] = x; m[13] = y; m[14] = z; return m; },
  S(s) { const m = M4.ident(); m[0] = m[5] = m[10] = s; return m; },
  RX(a) { const m = M4.ident(), c = Math.cos(a), s = Math.sin(a); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
  RY(a) { const m = M4.ident(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
  RZ(a) { const m = M4.ident(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },
  chain(...ms) { let r = ms[0]; for (let i = 1; i < ms.length; i++) r = M4.mul(r, ms[i]); return r; },
  point(m, x, y, z) { return [m[0] * x + m[4] * y + m[8] * z + m[12], m[1] * x + m[5] * y + m[9] * z + m[13], m[2] * x + m[6] * y + m[10] * z + m[14]]; },
  dir(m, x, y, z) { return [m[0] * x + m[4] * y + m[8] * z, m[1] * x + m[5] * y + m[9] * z, m[2] * x + m[6] * y + m[10] * z]; },
};

/* ---------------------------------------------------------------- palette */
const C = {
  k0: hex(0x07070c), k1: hex(0x12121a), k2: hex(0x1e1e2b), k3: hex(0x2e2e40), k4: hex(0x45455c),   // van blacks
  m0: hex(0x6b6b85), m1: hex(0x9a9ab5), m2: hex(0xc9c9dc),                                           // metal
  g0: hex(0x1a2c4e), g1: hex(0x3b6ea8), g2: hex(0x9fd4f2),                                           // glass
  c0: hex(0xfff3e6), c1: hex(0xffd9d0), c2: hex(0xe9a0b0), c3: hex(0x9a5080),                       // clouds
  f0: hex(0xfff6c0), f1: hex(0xffd23e), f2: hex(0xff8a1e), f3: hex(0xe8421e),                       // flame
  tl: hex(0xff5a6a),                                                                                 // tail light
  sA0: hex(0xf2c09a), sA1: hex(0xc98860), sB0: hex(0xa86a48), sB1: hex(0x7a4a34),                   // skin / wood
  h0: hex(0x3a2618),                                                                                 // hair
  bl0: hex(0x3fa7d6), bl1: hex(0x2a6f9e), gr0: hex(0x5fd06a), gr1: hex(0x3a8f4a), pu0: hex(0x9a6fe0), pu1: hex(0x6a48a8),
  sd: hex(0x0c2a1e), sg: hex(0x3cff8a), sc: hex(0x6cf0e0),                                           // laptop screens
  i0: hex(0x2a2438), i1: hex(0x3d3552), i2: hex(0x5a4a6e),                                           // van interior
  p0: hex(0x2a3350),                                                                                 // trousers
};
const PALETTE = Object.values(C);
const SKY = [hex(0x5c0b1f), hex(0x8e1126), hex(0xbb172a), hex(0xde2c30)];
const OUTLINE = hex(0x3a0714);

/* ------------------------------------------------------------ splat store */
// Every splat is a 3D gaussian: centre, full 3x3 covariance, colour, opacity,
// plus the id of the rigid group (door, head, cloud ...) that animates it.
const TW = 1024;
let cap = TW * 32, count = 0;
let sPos = new Float32Array(cap * 4), sCovA = new Float32Array(cap * 4), sCovB = new Float32Array(cap * 4), sCol = new Float32Array(cap * 4);
function grow() {
  cap *= 2;
  const g = a => { const b = new Float32Array(cap * 4); b.set(a); return b; };
  sPos = g(sPos); sCovA = g(sCovA); sCovB = g(sCovB); sCol = g(sCol);
}
function addCov(g, x, y, z, xx, xy, xz, yy, yz, zz, col, op) {
  if (count >= cap) grow();
  const o = count * 4;
  sPos[o] = x; sPos[o + 1] = y; sPos[o + 2] = z; sPos[o + 3] = g;
  sCovA[o] = xx; sCovA[o + 1] = xy; sCovA[o + 2] = xz;
  sCovB[o] = yy; sCovB[o + 1] = yz; sCovB[o + 2] = zz;
  sCol[o] = col[0]; sCol[o + 1] = col[1]; sCol[o + 2] = col[2]; sCol[o + 3] = op;
  return count++;
}
// flat disc gaussian lying on a surface with normal n
function addDisc(g, x, y, z, nx, ny, nz, r, th, col, op) {
  const r2 = r * r, k = th * th - r2;
  return addCov(g, x, y, z, r2 + k * nx * nx, k * nx * ny, k * nx * nz, r2 + k * ny * ny, k * ny * nz, r2 + k * nz * nz, col, op);
}
function addBlob(g, x, y, z, sx, sy, sz, col, op) { return addCov(g, x, y, z, sx * sx, 0, 0, sy * sy, 0, sz * sz, col, op); }
const OP = 2.2; // opacity gain > 1 flattens the top of the gaussian so surfaces read as solid

/* ----------------------------------------------------------------- groups */
const MAXG = 64;
const groups = [];
function addGroup(parent) {
  groups.push({ parent, local: M4.ident(), world: M4.ident(), op: 1, br: 1, fade: 1, wop: 1, wbr: 1, wfade: 1 });
  return groups.length - 1;
}

/* ------------------------------------------------- SDF -> surface splats */
// Walk a grid, keep the cells the surface passes through, and drop one disc
// splat on the surface per cell, oriented along the SDF gradient.
function sampleSDF(sdf, b, h, cb) {
  const nx = Math.ceil((b[3] - b[0]) / h), ny = Math.ceil((b[4] - b[1]) / h), nz = Math.ceil((b[5] - b[2]) / h);
  const e = h * 0.25, lim = h * 0.5;
  for (let k = 0; k < nz; k++) {
    const z = b[2] + (k + 0.5) * h;
    for (let j = 0; j < ny; j++) {
      const y = b[1] + (j + 0.5) * h;
      for (let i = 0; i < nx; i++) {
        const x = b[0] + (i + 0.5) * h;
        const d = sdf(x, y, z);
        if (d >= lim || d < -lim) continue;
        let gx = sdf(x + e, y, z) - sdf(x - e, y, z), gy = sdf(x, y + e, z) - sdf(x, y - e, z), gz = sdf(x, y, z + e) - sdf(x, y, z - e);
        const gl = Math.hypot(gx, gy, gz) || 1; gx /= gl; gy /= gl; gz /= gl;
        cb(x - gx * d, y - gy * d, z - gz * d, gx, gy, gz);
      }
    }
  }
}
const rbox = (cx, cy, cz, hx, hy, hz, r) => (x, y, z) => {
  const qx = Math.abs(x - cx) - hx + r, qy = Math.abs(y - cy) - hy + r, qz = Math.abs(z - cz) - hz + r;
  return Math.min(Math.max(qx, qy, qz), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) - r;
};
const sph = (cx, cy, cz, r) => (x, y, z) => Math.hypot(x - cx, y - cy, z - cz) - r;
const caps = (ax, ay, az, bx, by, bz, r) => {
  const ex = bx - ax, ey = by - ay, ez = bz - az, ee = ex * ex + ey * ey + ez * ez;
  return (x, y, z) => {
    const t = clamp(((x - ax) * ex + (y - ay) * ey + (z - az) * ez) / ee, 0, 1);
    return Math.hypot(x - ax - ex * t, y - ay - ey * t, z - az - ez * t) - r;
  };
};
const capCyl = (r, y, cy, rad, hh) => { const dx = r - rad, dy = Math.abs(y - cy) - hh; return Math.min(Math.max(dx, dy), 0) + Math.hypot(Math.max(dx, 0), Math.max(dy, 0)); };
function sdPoly(px, py, v) {
  const n = v.length / 2;
  let d = (px - v[0]) * (px - v[0]) + (py - v[1]) * (py - v[1]), s = 1;
  for (let i = 0, j = n - 1; i < n; j = i, i++) {
    const ex = v[j * 2] - v[i * 2], ey = v[j * 2 + 1] - v[i * 2 + 1], wx = px - v[i * 2], wy = py - v[i * 2 + 1];
    const t = clamp((wx * ex + wy * ey) / (ex * ex + ey * ey), 0, 1);
    const bx = wx - ex * t, by = wy - ey * t;
    d = Math.min(d, bx * bx + by * by);
    const c1 = py >= v[i * 2 + 1], c2 = py < v[j * 2 + 1], c3 = ex * wy > ey * wx;
    if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
  }
  return s * Math.sqrt(d);
}
// union of coloured parts; each part may live in its own group
function sampleParts(parts, b, h) {
  let cur = null;
  const f = (x, y, z) => { let d = 1e9; for (let i = 0; i < parts.length; i++) { const v = parts[i].sdf(x, y, z); if (v < d) { d = v; cur = parts[i]; } } return d; };
  const r = h * 0.58, th = h * 0.25;
  sampleSDF(f, b, h, (x, y, z, nx, ny, nz) => {
    f(x, y, z);
    const p = cur, c = p.col(x, y, z, nx, ny, nz);
    if (c) addDisc(p.g, x, y, z, nx, ny, nz, r, th, c, OP);
  });
}
// flat grid of discs: origin o, edges u and v
function quad(g, o, u, v, h, colFn) {
  const lu = Math.hypot(u[0], u[1], u[2]), lv = Math.hypot(v[0], v[1], v[2]);
  const nu = Math.max(1, Math.round(lu / h)), nv = Math.max(1, Math.round(lv / h));
  let nx = u[1] * v[2] - u[2] * v[1], ny = u[2] * v[0] - u[0] * v[2], nz = u[0] * v[1] - u[1] * v[0];
  const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const s = (i + 0.5) / nu, t = (j + 0.5) / nv;
    const x = o[0] + u[0] * s + v[0] * t, y = o[1] + u[1] * s + v[1] * t, z = o[2] + u[2] * s + v[2] * t;
    const c = colFn(x, y, z, i, j);
    if (c) addDisc(g, x, y, z, nx, ny, nz, h * 0.56, h * 0.2, c, OP);
  }
}

/* ============================================================== THE SCENE */
const G = { van: addGroup(-1), door: [[0, 0], [0, 0]], doorIn: [[0, 0], [0, 0]], men: [], clouds: [] };
for (let s = 0; s < 2; s++) for (let k = 0; k < 2; k++) { G.door[s][k] = addGroup(G.van); G.doorIn[s][k] = addGroup(G.door[s][k]); }
G.interior = addGroup(G.van);

// van frame: +x is forward, +y up, the sliding doors sit on the +z and -z flanks
const DX0 = -1.85, DX1 = 0.6, DMID = (DX0 + DX1) / 2, DY0 = 0.55, DY1 = 1.85;     // door opening
const IX0 = -2.36, IX1 = 0.78, IY0 = 0.5, IY1 = 1.88, IZ = 0.85;                   // cargo interior
const WX = [-1.55, 1.45];                                                          // jet (wheel) stations
const JET_Y = 0.05, JET_Z = 0.84;

/* ---- van body ---- */
(() => {
  const POLY = [-2.4, 0.1, 2.2, 0.1, 2.2, 0.88, 1.82, 1.08, 1.05, 1.9, -2.4, 1.9];
  const body = (x, y, z) => {
    const d2 = sdPoly(x, y, POLY), dz = Math.abs(z) - 0.85;
    let d = Math.min(Math.max(d2, dz), 0) + Math.hypot(Math.max(d2, 0), Math.max(dz, 0)) - 0.1;
    for (let i = 0; i < 2; i++) {
      const c = Math.max(Math.hypot(x - WX[i], y - JET_Y) - 0.52, 0.4 - Math.abs(z)); // arches where wheels would be
      d = Math.max(d, -c);
    }
    return d;
  };
  const glass = s => { const f = s * 1.3 - Math.floor(s * 1.3); return f < 0.12 ? C.g2 : f < 0.3 ? C.g1 : C.g0; };
  const H = 0.05, R = H * 0.56, TH = H * 0.22;
  sampleSDF(body, [-2.713, -0.213, -1.137, 2.52, 2.22, 1.14], H, (x, y, z, nx, ny, nz) => {
    const az = Math.abs(z), anz = Math.abs(nz), s = z >= 0 ? 0 : 1;
    const l = 0.25 * nx + 0.9 * ny + 0.35 * anz;
    let c = l > 0.78 ? C.k3 : l > 0.6 ? C.k4 : l > 0.2 ? C.k2 : l > -0.3 ? C.k1 : C.k0;
    let g = G.van;
    if (anz > 0.8) {                                             // flanks
      if (y < 0.3) c = C.k1;
      if (y > 1.09 && y < 1.14 && x < 1.75) c = C.m0;            // pinstripe
      if (y > 1.28 && y < 1.8 && x > 0.84 && x < 1.7 - (y - 1.15) * 0.94) c = glass(x + y * 0.8);   // cab window
      if (x > 0.86 && x < 1.04 && y > 0.98 && y < 1.05) c = C.m1;                                   // cab door handle
      const inDoor = x > DX0 && x < DX1 && y > DY0 && y < DY1;
      if (inDoor) {
        const k = x < DMID ? 0 : 1; g = G.door[s][k];
        if (x - DX0 < 0.03 || DX1 - x < 0.03 || y - DY0 < 0.03 || DY1 - y < 0.03 || Math.abs(x - DMID) < 0.028) c = C.k0;
        const hx = k ? x - DMID : DMID - x;
        if (hx > 0.1 && hx < 0.3 && y > 0.98 && y < 1.05) c = C.m1;                                 // door handles
      }
      if (anz > 0.9 && x > IX0 + 0.03 && x < IX1 - 0.03 && y > IY0 + 0.02 && y < IY1 - 0.02) {      // inner skin
        const gi = inDoor ? G.doorIn[s][x < DMID ? 0 : 1] : G.interior;
        const ci = y < 0.95 ? C.i0 : y < 1.0 ? C.i2 : C.i1;
        addDisc(gi, x, y, z - Math.sign(z) * 0.1, nx, ny, nz, R, TH, ci, OP);
      }
    } else if (nx > 0.5 && ny > 0.35 && y > 1.2 && y < 1.93) {   // windscreen
      if (az < 0.78) c = glass(z + y * 0.6);
    } else if (nx > 0.8 && y < 1.0) {                            // nose
      if (y > 0.5 && y < 0.8) {
        if (az > 0.48 && az < 0.88) c = (az > 0.58 && az < 0.8 && y > 0.57 && y < 0.73) ? C.f0 : C.f1;   // headlights
        else if (az < 0.4) c = (Math.floor(y / 0.075) & 1) ? C.k0 : C.k4;                                 // grille
      }
      if (y < 0.3) c = C.k4;
    } else if (nx < -0.8) {                                      // tail
      c = C.k1;
      if (y > 1.25 && y < 1.8 && az > 0.08 && az < 0.8) c = glass(z + y * 0.6);
      if (az < 0.028 && y > 0.3) c = C.k0;
      if (y > 0.55 && y < 1.1 && az > 0.72 && az < 0.93) c = y > 0.95 ? C.f2 : C.tl;
      if (y > 0.32 && y < 0.5 && az < 0.26) c = C.m2;
      if (y < 0.27) c = C.k4;
    }
    addDisc(g, x, y, z, nx, ny, nz, R, TH, c, OP);
  });

  // mirrors, antenna, dish
  for (const sg of [1, -1]) sampleParts([{ g: G.van, sdf: rbox(1.42, 1.34, sg * 1.05, 0.06, 0.09, 0.08, 0.02), col: (x, y, z, nx) => nx > 0.5 ? C.g1 : C.k1 }], [1.3, 1.2, sg * 1.05 - 0.15, 1.55, 1.48, sg * 1.05 + 0.15], 0.045);
  for (let i = 0; i < 14; i++) addBlob(G.van, -2.0, 2.02 + i * 0.055, 0.55, 0.022, 0.03, 0.022, i === 13 ? C.f3 : C.m1, OP);
  sampleParts([
    { g: G.van, sdf: (x, y, z) => Math.hypot(x + 0.9, (y - 2.24) / 0.42, z + 0.1) - 0.3, col: (x, y, z, nx, ny) => ny > 0.3 ? C.m2 : C.m0 },
    { g: G.van, sdf: rbox(-0.9, 2.08, -0.1, 0.04, 0.1, 0.04, 0.01), col: () => C.k4 },
  ], [-1.25, 1.97, -0.45, -0.55, 2.42, 0.25], 0.045);
  addBlob(G.van, -0.9, 2.44, -0.1, 0.03, 0.05, 0.03, C.m1, OP);
})();

/* ---- jets where the wheels would be ---- */
const JETS = [];
(() => {
  const jet = (x, y, z) => {
    const r = Math.hypot(x, z);
    let d = capCyl(r, y, 0.08, 0.29, 0.30) - 0.04;                 // pod
    d = Math.min(d, capCyl(r, y, -0.07, 0.36, 0.04) - 0.02);       // collar
    d = Math.min(d, capCyl(r, y, -0.35, 0.24, 0.09) - 0.01);       // nozzle
    return d;
  };
  for (const wx of WX) for (const sg of [1, -1]) {
    const cx = wx, cy = JET_Y, cz = sg * JET_Z;
    JETS.push([cx, cy - 0.45, cz]);
    sampleSDF((x, y, z) => jet(x - cx, y - cy, z - cz), [cx - 0.467, cy - 0.513, cz - 0.467, cx + 0.47, cy + 0.5, cz + 0.47], 0.045, (x, y, z, nx, ny, nz) => {
      const ly = y - cy, r = Math.hypot(x - cx, z - cz);
      const l = 0.3 * nx + 0.6 * ny + 0.5 * nz * sg;
      let c = l > 0.3 ? C.m1 : l > 0.0 ? C.m0 : C.k4;
      if (ly < -0.25) c = ny < -0.6 ? (r < 0.15 ? C.f0 : C.f2) : (l > 0.2 ? C.m0 : C.k4);
      else if (ly > -0.13 && ly < -0.01 && r > 0.34) c = l > 0.2 ? C.m2 : C.m1;
      else if (ly > 0.2 && ly < 0.27) c = C.k1;
      addDisc(G.van, x, y, z, nx, ny, nz, 0.045 * 0.56, 0.045 * 0.22, c, OP);
    });
  }
})();

/* ---- cargo bay ---- */
const LEDS = [];
const TABLES = [-1.265, 0.015];
(() => {
  const g = G.interior, h = 0.055;

const CLOUDS = [];
(() => {
  const rnd = mulberry(20261116);
  const N = 22;
  for (let ci = 0; ci < N; ci++) {
    const g = addGroup(-1); G.clouds.push(g);
    const n = 4 + Math.floor(rnd() * 4), puffs = [];
    let x = -(n - 1) * 0.36;
    for (let i = 0; i < n; i++) {
      const mid = 1 - Math.abs(i / (n - 1) * 2 - 1), r = 0.42 + 0.36 * mid + rnd() * 0.18;
      puffs.push([x + (rnd() - 0.5) * 0.2, r * 0.4 + rnd() * 0.22 * mid, (rnd() - 0.5) * 0.5, r]);
      x += 0.72;
    }
    puffs.push([(rnd() - 0.5) * n * 0.4, 0.15, 0.5, 0.42 + rnd() * 0.15], [(rnd() - 0.5) * n * 0.4, 0.15, -0.5, 0.42 + rnd() * 0.15]);
    let b = [1e9, -0.07, 1e9, -1e9, 0, -1e9];
    for (const p of puffs) { b[0] = Math.min(b[0], p[0] - p[3]); b[3] = Math.max(b[3], p[0] + p[3]); b[4] = Math.max(b[4], p[1] + p[3]); b[2] = Math.min(b[2], p[2] - p[3]); b[5] = Math.max(b[5], p[2] + p[3]); }
    const top = b[4], k = 0.2;
    const sdf = (x, y, z) => {
      let d = 1e9;
      for (let i = 0; i < puffs.length; i++) {
        const p = puffs[i], v = Math.hypot(x - p[0], y - p[1], z - p[2]) - p[3];
        const hh = clamp(0.5 + 0.5 * (v - d) / k, 0, 1); d = v + (d - v) * hh - k * hh * (1 - hh);   // smooth union
      }
      return Math.max(d, -y);                                                                         // flat base
    };
    const h = 0.13, yoff = -top * 0.45;
    sampleSDF(sdf, [b[0] - 0.133, b[1], b[2] - 0.133, b[3] + 0.13, b[4] + 0.13, b[5] + 0.13], h, (x, y, z, nx, ny, nz) => {
      const t = ny * 0.7 + (y / top) * 0.55;
      const c = ny < -0.7 ? C.c3 : t > 0.72 ? C.c0 : t > 0.3 ? C.c1 : t > -0.05 ? C.c2 : C.c3;
      addDisc(g, x, y + yoff, z, nx, ny, nz, h * 0.6, h * 0.3, c, OP);
    });
    // lane around the flight path: never through the van itself
    let cy, cz;
    do { const a = (ci + rnd()) / N * Math.PI * 2, rho = 3.1 + rnd() * 4.6; cy = Math.sin(a) * rho * 0.85; cz = Math.cos(a) * rho; } while (Math.hypot(cy, cz) < 3.0);
    const scale = 0.6 + rnd() * 0.75;
    CLOUDS.push({ g, y: cy - 0.2, z: cz, x0: (rnd() * 2 - 1) * 13, speed: 1.3 + rnd() * 1.3, scale, ex: (b[3] - b[0]) * 0.5 * scale, ey: top * 0.5 * scale });
  }
})();

function setCol(i, c) { const o = i * 4; sCol[o] = c[0]; sCol[o + 1] = c[1]; sCol[o + 2] = c[2]; }
function updateDynamic(t) {
  // jet flames
  for (let j = 0; j < JETS.length; j++) {
    const J = JETS[j];
    for (let k = 0; k < FLAME_N; k++) {
      const i = flame0 + j * FLAME_N + k, o = i * 4;
      const cyc = t * (2.0 + 1.2 * hash(k * 7.1 + j * 13.3)) + hash(k * 3.7 + j * 5.1);
      const n = Math.floor(cyc), u = cyc - n, seed = n * 1.37 + k * 17.3 + j * 101.1;
      const ox = hash(seed) - 0.5, oz = hash(seed + 31.7) - 0.5, L = 0.5 + 0.28 * hash(seed + 5.3);
      const spread = 0.26 * (1 - u);
      sPos[o] = J[0] + ox * spread - 0.3 * u * u;
      sPos[o + 1] = J[1] - 0.02 - u * L;
      sPos[o + 2] = J[2] + oz * spread;
      const sg = 0.03 + 0.085 * (1 - u), sy = sg * 1.5;
      sCovA[o] = sg * sg; sCovB[o] = sy * sy; sCovB[o + 2] = sg * sg;
      const c = u < 0.12 ? C.f0 : u < 0.38 ? C.f1 : u < 0.68 ? C.f2 : C.f3;
      sCol[o] = c[0]; sCol[o + 1] = c[1]; sCol[o + 2] = c[2]; sCol[o + 3] = 2.0 * (1 - u * 0.75);
    }
  }
  // laptop screens: scrolling lines of code, bottom line being typed
  for (let mi = 0; mi < SCREENS.length; mi++) {
    const S = SCREENS[mi], scroll = t * 1.7 + mi * 0.37, line0 = Math.floor(scroll), typed = scroll - line0;
    for (let r = 0; r < S.rows; r++) {
      const line = line0 - r, full = 2 + Math.floor(hash(line * 1.7 + mi * 9.1) * (S.cols - 1));
      const len = r === 0 ? Math.ceil(full * typed) : full, hue = hash(line * 3.1 + mi) > 0.7 ? C.sc : C.sg;
      for (let c = 0; c < S.cols; c++) setCol(S.first + r * S.cols + c, c < len ? hue : (r === 0 && c === len && (t * 3 % 1) < 0.5) ? C.c0 : C.sd);
    }
  }
  for (let i = 0; i < LEDS.length; i++) {
    const on = hash(i * 5.3 + Math.floor(t * (1.5 + hash(i) * 5))) > 0.35;
    setCol(led0 + i, on ? (i % 5 === 0 ? C.f3 : i % 3 === 0 ? C.f1 : C.sg) : C.k0);
  }
  setCol(beacon, (t % 1.2) < 0.25 ? C.f0 : C.f3);
}

const VS = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
layout(location=0) in vec2 aQuad;
layout(location=1) in uint aIdx;
uniform sampler2D uPos, uCovA, uCovB, uCol, uGrp;
uniform mat4 uView, uProj;
uniform vec2 uVp, uFocal;
uniform float uSig;
out vec4 vCol; out vec2 vQ; flat out float vFade;
void main() {
  int i = int(aIdx);
  ivec2 tc = ivec2(i & 1023, i >> 10);
  vec4 P = texelFetch(uPos, tc, 0);
  int g = int(P.w + 0.5);
  mat4 M = mat4(texelFetch(uGrp, ivec2(0, g), 0), texelFetch(uGrp, ivec2(1, g), 0), texelFetch(uGrp, ivec2(2, g), 0), texelFetch(uGrp, ivec2(3, g), 0));
  vec4 gp = texelFetch(uGrp, ivec2(4, g), 0);
  vec4 col = texelFetch(uCol, tc, 0);
  col.a *= gp.x; col.rgb *= gp.y;
  vec4 pv = uView * (M * vec4(P.xyz, 1.0));
  gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  vCol = col; vQ = vec2(0.0); vFade = gp.z;
  if (col.a < 0.01 || gp.z < 0.03 || pv.z > -0.6) return;
  // 3D covariance -> view space -> 2D screen-space covariance (EWA splatting)
  vec3 ca = texelFetch(uCovA, tc, 0).xyz, cb = texelFetch(uCovB, tc, 0).xyz;
  mat3 Sg = mat3(ca.x, ca.y, ca.z, ca.y, cb.x, cb.y, ca.z, cb.y, cb.z);
  mat3 A = mat3(uView) * mat3(M);
  mat3 Sv = A * Sg * transpose(A);
  float z = -pv.z;
  vec2 lim = 1.3 * 0.5 * uVp / uFocal;
  vec2 xy = clamp(pv.xy / z, -lim, lim) * z;
  mat3 J = mat3(uFocal.x / z, 0.0, 0.0,  0.0, uFocal.y / z, 0.0,  uFocal.x * xy.x / (z * z), uFocal.y * xy.y / (z * z), 0.0);
  mat3 Cm = J * Sv * transpose(J);
  float a = Cm[0][0] * uSig + 0.25, d = Cm[1][1] * uSig + 0.25, b = Cm[0][1] * uSig;
  float mid = 0.5 * (a + d), rad = length(vec2(0.5 * (a - d), b));
  float l1 = mid + rad, l2 = max(mid - rad, 0.05);
  vec2 v1 = abs(b) < 1e-6 ? (a >= d ? vec2(1.0, 0.0) : vec2(0.0, 1.0)) : normalize(vec2(b, l1 - a));
  vec2 v2 = vec2(-v1.y, v1.x);
  vec2 off = (v1 * sqrt(l1) * aQuad.x + v2 * sqrt(l2) * aQuad.y) * 3.0;
  vQ = aQuad * 3.0;
  vec4 clip = uProj * pv;
  clip.xy += off * 2.0 / uVp * clip.w;
  gl_Position = clip;
}`;
const BAYER = `
const float BAY[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
float bayer(ivec2 p) { p &= 3; return (BAY[p.y * 4 + p.x] + 0.5) / 16.0; }`;
const FS = `#version 300 es
precision highp float;
in vec4 vCol; in vec2 vQ; flat in float vFade;
out vec4 o;
${BAYER}
void main() {
  float r2 = dot(vQ, vQ);
  if (r2 > 9.0) discard;
  if (vFade < 0.99 && bayer(ivec2(gl_FragCoord.xy)) > vFade) discard;   // screen-door fade for clouds crossing the view
  float a = min(vCol.a * exp(-0.5 * r2), 0.99);
  if (a < 0.004) discard;
  o = vec4(vCol.rgb * a, a);
}`;
const PVS = `#version 300 es
layout(location=0) in vec2 aQuad;
void main() { gl_Position = vec4(aQuad, 0.0, 1.0); }`;
const PFS = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uScene;
uniform vec2 uRes; uniform float uTime; uniform int uRaw;
uniform vec3 uPal[${PALETTE.length}]; uniform vec3 uSky[4]; uniform vec3 uOutline;

float h1(float x) { return fract(sin(x * 91.3458) * 47453.5453); }
vec3 sky(ivec2 p) {
  float g = (1.0 - (float(p.y) + 0.5) / uRes.y) * 3.0;
  float gi = floor(g);
  int idx = clamp(int(gi) + (smoothstep(0.2, 0.8, g - gi) > bayer(p) ? 1 : 0), 0, 3);
  // thin streaks rushing past: we are flying
  float row = float(p.y), hr = h1(row);
  if (hr > 0.9) {
    float x = fract(float(p.x) / uRes.x * 0.6 + uTime * (0.25 + hr * 0.5) + hr * 37.0);
    if (x < 0.05 + 0.06 * h1(row + 3.0)) idx = min(idx + 1, 3);

}
float alphaAt(ivec2 p) { return texelFetch(uScene, clamp(p, ivec2(0), ivec2(uRes) - 1), 0).a; }
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);

    vec3 c = s.rgb / s.a;
    float d1 = 1e9, d2 = 1e9; vec3 c1 = c, c2 = c;
    for (int i = 0; i < ${PALETTE.length}; i++) {
